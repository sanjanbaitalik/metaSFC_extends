# MS-A-NCR pre-full-run grid closure (prompt v6).
# Identical frozen protocol to configs/iclr/msancr_refinement.yaml; only the
# inner-CV-justified boundary values are added.  New lower boundaries:
# ridge 0.001, gamma 0.1, lambda_L 0.03.  No further expansion in this run.
experiment_name: msancr_grid_closure_working_memory
seeds: [0, 1, 2]
n_outer_folds: 5
n_inner_folds: 3
historical_val_fraction: 0.15
n_rois: 116
n_threads: 4

data:
  fc_path: inputs/dataset_FC/FC_all.npy
  sc_path: inputs/dataset_SC/SC_all.npy
  y_path: inputs/dataset_SC/label_all.npy
  subjects_path: inputs/dataset_SC/hcp_subjects_used.csv
  groups_path: null

targets:
  working_memory:
    name: "Working Memory (ListSort_Unadj)"
    label_path: inputs/dataset_SC/task_labels/ListSort_Unadj/label_all.npy

priors:
  working_memory:
    matched: outputs/priors/llm/working_memory_contrastive_qwen3/roi_prior.csv
    unrelated: outputs/priors/llm/fluid_intelligence_contrastive_qwen3/roi_prior.csv
    shuffled: outputs/priors/llm/working_memory_contrastive_qwen3_shuffled/roi_prior.csv
    random: outputs/priors/random_prior/aal116/roi_prior.csv

prior_controls: [unrelated, shuffled, random]
lifting_rules: [prod, mean]
gamma_grid: [0.1, 0.25, 0.5, 1.0, 2.0]
lambda_laplacian_grid: [0.03, 0.1, 0.5, 1.0, 2.0, 5.0]
ridge_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
# Identical to ridge_grid: this closure run performs NO further expansion.
ridge_expanded_grid: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]

top_k: 10
diagonal_epsilon: 0.001
laplacian_weighting: binary
laplacian_normalization: sym
pearson_tie_tolerance: 0.002
max_material_rmse_degradation: 0.1

output_dir: outputs/iclr/msancr_grid_closure
figures_dir: figures/iclr/msancr_grid_closure
