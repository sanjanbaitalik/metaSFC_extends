experiment_name: "experiment_diag_edge_prior_hcp"
baseline: "ms_inter_gcn"
prior_type: "node"
task: "regression"

roi_num: 116
hidden_channels: 64
dropout: 0.3
batch_size: 4
learning_rate: 0.001
weight_decay: 0.0001
n_epochs: 20
alpha_aux: 0.1
topk: 10
n_folds: 2
seeds: [0]

lambda_node: 0.0
lambda_module: 0.0
lambda_edge: 0.01

data:
  fc_path: "inputs/dataset_FC/FC_all.npy"
  sc_path: "inputs/dataset_SC/SC_all.npy"
  y_path: "inputs/dataset_SC/label_all.npy"

prior:
  roi_prior_path: "outputs/priors/working_memory/aal116/roi_prior.csv"
  module_prior_path: "outputs/priors/working_memory/aal116/module_prior.csv"
  edge_prior_path: "outputs/priors/working_memory/aal116/edge_prior.npy"
  roi_to_module_path: "inputs/atlases/AAL116_coarse_modules.csv"

output_dir: "outputs/hcp/diag_edge_prior_working_memory"
seed: 42
device: "auto"