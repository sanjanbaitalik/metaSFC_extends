[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metascfc"
version = "0.2.0"
description = "Meta-analysis-guided functional-structural connectome graph learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "pandas>=1.5.0",
  "scipy>=1.10.0",
  "scikit-learn>=1.2.0",
  "torch>=2.0.0",
  "torch-geometric>=2.3.0",
  "nibabel>=5.0.0",
  "nilearn>=0.10.0",
  "matplotlib>=3.6.0",
  "seaborn>=0.12.0",
  "pyyaml>=6.0",
  "tqdm>=4.64.0",
  "joblib>=1.2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
